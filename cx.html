<%@ page language="java" contentType="text/html; charset=UTF-8" pageEncoding="UTF-8"%>
<%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Thêm mới User & Transaction - CodeGym</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Nhúng file CSS tùy chỉnh -->
    <link rel="stylesheet" href="${pageContext.request.contextPath}/css/style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-lg">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0 fw-bold"><i class="fa-solid fa-user-plus"></i> Thêm mới Người dùng (Transaction)</h4>
                        <a href="users" class="btn btn-light btn-sm text-success fw-bold">Danh sách</a>
                    </div>
                    <div class="card-body p-4">
                        <form action="users?action=insert" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Họ tên:</label>
                                <input type="text" name="name" class="form-control" placeholder="Nhập họ tên..." required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email:</label>
                                <input type="email" name="email" class="form-control" placeholder="Nhập email..." required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Quốc gia:</label>
                                <input type="text" name="country" class="form-control" placeholder="Nhập quốc gia..." required>
                            </div>

                            <!-- Khối checkbox phân quyền để test Transaction -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Quyền hạn (Permissions):</label>
                                <div class="d-flex flex-wrap gap-3 p-3 bg-white border rounded">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="permissions" value="1" id="perm1">
                                        <label class="form-check-label" for="perm1">Thêm (Add)</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="permissions" value="2" id="perm2">
                                        <label class="form-check-label" for="perm2">Sửa (Edit)</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="permissions" value="3" id="perm3">
                                        <label class="form-check-label" for="perm3">Xoá (Delete)</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="permissions" value="4" id="perm4">
                                        <label class="form-check-label" for="perm4">Xem (View)</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="users" class="btn btn-secondary px-4">Hủy bỏ</a>
                                <button type="submit" class="btn btn-success px-4">Lưu thông tin</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
